# Builds the static Astro site and publishes it to GitHub Pages
# (https://gokublackssj.github.io/). Needs no secrets: dependencies come from
# the public npm registry and the build reads no environment variables.
#
# Actions are pinned to full commit SHAs; the comment gives the release.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege by default: the build only reads the repository.
permissions:
  contents: read

# One deployment at a time; a running deployment is never cancelled midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing pushes back to the repository, so the token is not kept.
          persist-credentials: false

      # Installs from package-lock.json, runs `npm run build` (astro check +
      # astro build) and uploads dist/ (hidden files included, so .nojekyll
      # stays) as the Pages artifact.
      - name: Build with Astro
        uses: withastro/action@a8b97df764791eb61fbf3338ef713b0e61ae05c5 # v6.1.4
        with:
          node-version: 24

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Only this job may publish: pages: write to deploy, id-token: write for
    # the OIDC token that deploy-pages requires.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
